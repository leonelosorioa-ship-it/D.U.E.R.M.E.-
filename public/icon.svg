<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2352b5"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#skyGrad)"/>
  
  <!-- Subtle stars -->
  <circle cx="120" cy="110" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="390" cy="130" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="340" cy="80" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="90" cy="240" r="2.5" fill="#818cf8" opacity="0.5"/>
  <circle cx="430" cy="280" r="2" fill="#ffffff" opacity="0.6"/>
  
  <!-- Moon with soothing glow -->
  <g filter="url(#glow)">
    <path d="M290 140 A 120 120 0 1 0 380 340 A 100 100 0 0 1 290 140 Z" fill="url(#moonGrad)" />
  </g>
  
  <!-- Brainwave / Sleep frequency lines -->
  <path d="M150 370 Q 185 345 220 370 T 290 370 T 360 370" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M170 395 Q 200 380 230 395 T 285 395 T 340 395" fill="none" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Text Label -->
  <text x="256" y="450" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="6">D.U.E.R.M.E.</text>
</svg>
